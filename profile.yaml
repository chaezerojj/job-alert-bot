# 이 파일을 복사해서 profile.yaml로 저장한 뒤 채워 넣으세요.
#   cp profile.example.yaml profile.yaml
# 코드가 읽기만 하고 수정하지 않습니다. (설계: docs/SPEC.md 5장)
#
# 구조
#   1. synonyms  : 동의어 사전. 회사마다 다른 표현을 "개념" 하나로 묶는다
#   2. tracks    : 지원 트랙. 트랙마다 검색어, 통과 조건, 점수 기준이 다르다
#   3. 공통 설정 : 경력 요약, 제외어, 메일 설정
#
# 트랙의 조건에는 단어가 아니라 synonyms 의 "개념 이름"을 쓴다.
# 새 표현을 발견하면 synonyms 에만 추가하면 모든 트랙에 반영된다.

# ─────────────────────────────────────────────
# 1. 동의어 사전 (개념 이름: [회사들이 쓰는 표현들])
#    비교할 때 대소문자·공백·점(.)·하이픈·슬래시·가운뎃점(·)은 무시한다
#    2글자 이하 영문 약어(FE, AX, IT 등)는 단어 단위로만 매칭한다
# ─────────────────────────────────────────────
synonyms:
  # 직무
  frontend:   [프론트엔드, 프론트앤드, 프론트 개발, Front-end, Frontend, FE, 웹 프론트, 웹 클라이언트, UI 개발, 웹 UI]
  web_dev:    [웹 개발, 웹개발, 웹 서비스 개발, 웹 애플리케이션, Web Developer]
  sw_dev:     [SW개발, SW 개발, 소프트웨어 개발, 소프트웨어 엔지니어, Software Engineer, 개발직, IT개발]
  it_general: [IT, ICT, 전산, 정보시스템, IT직군, 정보기술, 디지털/IT, IT/디지털, 디지털 직무, 디지털 인재, IT 인재, ICT 인재]
  mobile:     [앱 개발, 모바일, React Native, 크로스플랫폼, Cross-platform]

  # AI · AX
  ax:         [AX, AI Transformation, AI 전환, AI 혁신, AI 내재화, AI 도입, AI 확산, AI 인재, AX 인재]
  dx:         [DX, DT, 디지털 전환, 디지털혁신, Digital Transformation]
  genai:      [생성형 AI, 생성형AI, GenAI, Generative AI, LLM, 대규모 언어모델, 거대언어모델, 챗GPT, ChatGPT]
  ai_app:     [AI 서비스, AI 서비스 개발, AI 애플리케이션, AI 플랫폼, AI 솔루션, AI 에이전트, Agent, 챗봇, Copilot, 코파일럿]
  rag:        [RAG, 검색증강, 벡터 DB, Vector DB, 임베딩, Embedding, 프롬프트 엔지니어링, Prompt Engineering]
  vision:     [컴퓨터 비전, Computer Vision, MediaPipe, 영상 인식, 온디바이스 AI, On-device AI, 엣지 AI]
  research:   [Research Scientist, 리서치 사이언티스트, 박사 우대, 박사 이상, 석사 이상, 논문 실적, 연구 실적]

  # 스택
  react:      [React, ReactJS, 리액트]
  nextjs:     [Next.js, NextJS]
  typescript: [TypeScript, 타입스크립트, TS]
  javascript: [JavaScript, 자바스크립트, JS, ES6]
  vite:       [Vite]
  tailwind:   [Tailwind, TailwindCSS, 테일윈드]
  state_mgmt: [Zustand, Redux, Recoil, Jotai, React Query, TanStack Query]
  realtime:   [WebSocket, 웹소켓, 실시간 통신, Socket.io, WebRTC]
  push:       [FCM, 푸시 알림, Push Notification]
  test:       [Jest, Playwright, Cypress, Testing Library, 테스트 자동화]

  # 채용 형태
  newgrad:    [신입, 신입사원, 경력무관, 신입/경력, 주니어, Junior]
  open_hire:  [공개채용, 공채, 하반기 채용, 상반기 채용, 신입사원 모집, 채용연계형 인턴, 전환형 인턴]

# ─────────────────────────────────────────────
# 2. 지원 트랙
#    must_any  : 이 개념 중 하나라도 있으면 통과
#    must_all  : 그룹마다 개념이 하나 이상 있어야 통과 (모든 그룹 만족)
#    exclude_concepts : 이 개념이 있으면 이 트랙에서만 탈락
#    priority  : 여러 트랙을 통과하면 숫자가 큰 트랙 섹션에 표시
# ─────────────────────────────────────────────
tracks:
  - id: fe
    label: 프론트엔드 (스타트업·중견)
    priority: 1
    career: { min: 0, max: 2 }
    search_keywords: [프론트엔드, React, 웹 개발]
    must_any: [frontend, react, web_dev]
    boost: { typescript: 3, react: 3, nextjs: 3, vite: 2, tailwind: 2, state_mgmt: 2, realtime: 2, mobile: 1, test: 1 }
    llm_focus: 기술 스택과 경력 요건이 맞는지를 가장 중요하게 본다.

  - id: bigco
    label: 대기업 · 공채 개발직
    priority: 3
    career: { min: 0, max: 0 }           # 신입만
    search_keywords: [신입 개발, SW개발 신입, IT 신입사원, 디지털 신입]
    saramin:
      bbs_gb: 1                          # 공채속보만 (상장사 필터는 비상장 계열사를 빠뜨려서 쓰지 않음)
    must_all:
      - [open_hire, newgrad]                              # 신입 채용이면서
      - [sw_dev, it_general, web_dev, frontend, ax, dx]   # 개발·IT·디지털 직무
    boost: { open_hire: 3, frontend: 3, web_dev: 2, dx: 2, ax: 2 }
    llm_focus: >
      신입 공채이고 개발·IT·디지털 직군이 포함되어 있는지를 본다.
      기술 스택이 적혀 있지 않은 것은 감점하지 않는다.
      비전공자 지원이 가능한지, 직무 부트캠프 수료가 우대되는지 언급이 있으면 reason에 쓴다.
    # 관심 기업: 회사명마다 사람인에서 따로 검색하고, 걸린 공고는 이 트랙 통과 + 가산점
    watch_companies: []                  # 예: [CJ올리브네트웍스, 하나은행, LG CNS, 삼성SDS]

  - id: ax
    label: AX · AI 서비스
    priority: 2
    career: { min: 0, max: 2 }
    search_keywords: [AX, AI 서비스, 생성형 AI, LLM]
    must_any: [ax, genai, ai_app, rag]
    exclude_concepts: [research]
    boost: { ai_app: 3, genai: 3, rag: 2, frontend: 2, react: 2, vision: 2, dx: 1 }
    llm_focus: >
      AI를 활용한 서비스 기획·개발·도입 직무인지 본다.
      연구직(논문, 모델 학습, 박사 우대)이나 순수 데이터 사이언스 직무는 크게 감점한다.
      프론트엔드나 서비스 개발 경험, AI 도구를 업무에 적용한 경험이 강점이 되는 직무면 가산한다.

# ─────────────────────────────────────────────
# 3. 공통 설정
# ─────────────────────────────────────────────

# LLM에게 전달하는 경력 요약 (모든 트랙 공통)
experience_summary: |
  SSAFY 수료. 팀 프로젝트 3건에서 프론트엔드 담당.
  온디바이스(Jetson) React 앱, WebSocket+FCM 통신 레이어 구현,
  첫 화면 번들 크기 약 90% 감량 경험.
  MediaPipe 기반 AI 서비스, 생성형 AI·RAG 교육 이수.
  팀 프로젝트에서 AWS Lambda 기반 알림 봇(MR 알림, 일일 Jira 요약) 운영.
  Claude·Codex 등 AI 도구와 md 가이드 문서로 개발하는 방식에 익숙함.
  비전공(광고홍보학) 출신.

prefer:
  locations: []   # 예: [서울, 경기 성남] — 비우면 지역 무관

# 모든 트랙 공통 제외어 (제목·경력 조건에 있으면 제외)
exclude_keywords: [시니어, 팀장, 리드, 책임급, "7년 이상", "10년 이상"]

mail:
  max_items_per_track: 7   # 트랙별 카드 개수
  min_score: 60            # 이 점수 미만은 하단 목록으로